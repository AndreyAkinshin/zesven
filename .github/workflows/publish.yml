# Publish workflow for releasing new versions to crates.io and GitHub.
#
# Trigger: Manual via workflow_dispatch, usually through `mise run publish X.Y.Z`
#
# Workflow:
#   1. publish: Publish to crates.io
#   2. create-tag: Create and push git tag (v{version} from VERSION)
#   3. create-release: Create GitHub Release
#
# Required secrets:
#   CARGO_REGISTRY_TOKEN  - crates.io API token for publishing
#
# The tag and release go out under GITHUB_TOKEN, whose pushes deliberately do
# not start other workflows - nothing here is triggered by a tag or a release.

name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================================================
  # Guards - what must hold before anything is published
  # ==========================================================================

  branch:
    name: Check the ref
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish from anything but the default branch
        # workflow_dispatch takes a ref, and a release cut from a branch would
        # publish whatever is on it under the version in that branch's VERSION.
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            echo "Publishing is only allowed from the default branch; got ${{ github.ref }}" >&2
            exit 1
          fi

  # The whole of CI, on the very commit about to be published. `mise run
  # publish` pushes and dispatches in one breath, so waiting for the push's own
  # run would be waiting for something that may not have started; running it
  # here ties the green tick to this SHA and nothing else.
  ci:
    name: CI
    needs: [branch]
    uses: ./.github/workflows/ci.yml

  # ==========================================================================
  # Publish to crates.io
  # ==========================================================================

  publish:
    name: Publish to crates.io
    needs: [branch, ci]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Verify the manifest matches
        run: |
          MANIFEST=$(grep -m1 '^version = ' rs/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ "$MANIFEST" != "${{ steps.version.outputs.version }}" ]]; then
            echo "VERSION says ${{ steps.version.outputs.version }}, rs/Cargo.toml says $MANIFEST"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: rs

  # ==========================================================================
  # Create Git Tag
  # ==========================================================================

  create-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4

      - name: Create and push tag
        run: |
          VERSION="${{ needs.publish.outputs.version }}"
          TAG="v$VERSION"

          echo "Creating tag: $TAG"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "Tag $TAG created and pushed"

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish, create-tag]
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.4.1
        with:
          tag_name: v${{ needs.publish.outputs.version }}
          name: v${{ needs.publish.outputs.version }}
          generate_release_notes: true
