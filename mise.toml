min_version = "2024.12.0"

[tools]
node = "22"
pnpm = "latest"

[env]
CARGO_TERM_COLOR = "always"

[tasks.fmt]
description = "Check code formatting"
dir = "rs"
run = "cargo fmt --all --check"

[tasks."fmt:fix"]
description = "Fix code formatting"
dir = "rs"
run = "cargo fmt --all"

[tasks.clippy]
description = "Run clippy lints"
dir = "rs"
run = "cargo clippy --all-features --all-targets -- -D warnings"

[tasks."clippy:fix"]
description = "Run clippy with auto-fix"
dir = "rs"
run = "cargo clippy --all-features --all-targets --fix --allow-dirty --allow-staged"

[tasks.docs]
description = "Build Rust API documentation"
dir = "rs"
run = "cargo doc --all-features --no-deps"

[tasks."docs:open"]
description = "Build and open Rust API documentation in browser"
dir = "rs"
run = "cargo doc --all-features --no-deps --open"

[tasks."docs:site"]
description = "Build VitePress documentation site"
dir = "docs"
run = "pnpm build"

[tasks."docs:dev"]
description = "Run VitePress documentation site in dev mode"
dir = "docs"
depends = ["docs:install"]
run = "pnpm dev"

[tasks."docs:preview"]
description = "Preview built VitePress documentation site"
dir = "docs"
run = "pnpm preview"

[tasks."docs:install"]
description = "Install VitePress documentation dependencies"
dir = "docs"
run = "pnpm install"

[tasks.msrv]
description = "Check MSRV (requires Rust 1.85)"
dir = "rs"
run = "cargo check --all-features"

[tasks.check]
description = "Run all static analysis"
depends = ["fmt", "clippy"]

[tasks."check:fix"]
description = "Auto-fix all static analysis issues"
depends = ["fmt:fix", "clippy:fix"]

[tasks."check:cargo"]
description = "Run cargo check with all features"
dir = "rs"
run = "cargo check --all-features"

[tasks.clean]
description = "Remove build artifacts"
dir = "rs"
run = "cargo clean"

[tasks.restore]
description = "Restore dependencies"
dir = "rs"
run = "cargo fetch"

[tasks.build]
description = "Build with all features"
dir = "rs"
run = "cargo build --all-features"

[tasks.test]
description = "Run all tests with all features"
dir = "rs"
run = "cargo test --all-features"

[tasks.features]
description = "Check and test with specific feature flags"
dir = "rs"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo check "$@"
cargo test "$@"
'''

[tasks."features:matrix"]
description = "Test all feature combinations (same as CI)"
dir = "rs"
run = '''
#!/usr/bin/env bash
set -euo pipefail

feature_sets=(
  "--no-default-features"
  "--all-features"
  "--features lzma"
  "--features lzma2"
  "--features deflate"
  "--features bzip2"
  "--features ppmd"
  "--features aes"
  "--features parallel"
  "--features lzma,aes"
  "--features lzma,parallel"
  # async without a codec: it can open an archive and decode nothing, and it is
  # exactly the sort of combination that quietly stops compiling.
  "--no-default-features --features async"
)

for features in "${feature_sets[@]}"; do
  echo "=== Testing: $features ==="
  cargo check $features
  cargo test $features
done
'''

[tasks."tools:7zip"]
description = "Fetch the pinned reference 7-Zip binary for interop tests"
dir = "rs"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Pinned so the reference behaviour cannot drift under us between runs.
version="26.02"
release="7z2602"
dest="target/tools/7zz"

if [[ -x "$dest" ]]; then
  echo "reference 7-Zip already present: $dest"
  exit 0
fi

case "$(uname -s)-$(uname -m)" in
  Linux-x86_64)   asset="${release}-linux-x64.tar.xz"
                  sha="41aaba7b1235304ab5aa0624530c67ae829496cd29e875925271efdccc28c03e" ;;
  Linux-aarch64)  asset="${release}-linux-arm64.tar.xz"
                  sha="70ea6cc737ae1495ea2d7eb20ef3120fe579bd3f1a83a9d2362b62ec5bde2bba" ;;
  Darwin-*)       asset="${release}-mac.tar.xz"
                  sha="1cf6760579502f87e591ff5c73a005ec50b3e4d6f507e8b038382d563c3175b9" ;;
  *)              echo "no pinned 7-Zip build for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
esac

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

curl -fsSL "https://github.com/ip7z/7zip/releases/download/${version}/${asset}" -o "$tmp/$asset"

if command -v sha256sum >/dev/null 2>&1; then
  echo "${sha}  ${tmp}/${asset}" | sha256sum -c -
else
  echo "${sha}  ${tmp}/${asset}" | shasum -a 256 -c -
fi

tar -xf "$tmp/$asset" -C "$tmp" 7zz
mkdir -p "$(dirname "$dest")"
mv "$tmp/7zz" "$dest"
chmod +x "$dest"
echo "reference 7-Zip installed: $dest"
'''

[tasks."test:interop"]
description = "Run interoperability tests against the reference 7-Zip binary"
dir = "rs"
depends = ["tools:7zip"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
# ZESVEN_REQUIRE_7Z turns a missing reference binary into a failure instead of a
# skip, so this coverage cannot silently disappear.
ZESVEN_REQUIRE_7Z=1 cargo test --all-features --test interop_7zip
'''

[tasks.wasm]
description = "Check WASM compilation"
dir = "rs"
run = "cargo check --target wasm32-unknown-unknown --features wasm"

[tasks.thread-safety]
description = "Run ThreadSanitizer tests (nightly + rust-src required)"
dir = "rs"
env = { RUSTFLAGS = "-Zsanitizer=thread", RUST_MIN_STACK = "8388608" }
run = '''
cargo test --features "parallel lzma2" test_parallel \
  -Z build-std --target x86_64-unknown-linux-gnu
'''

[tasks.coverage]
description = "Generate code coverage report"
dir = "rs"
run = "cargo llvm-cov --all-features"

[tasks.coverage-html]
description = "Generate HTML coverage report"
dir = "rs"
run = "cargo llvm-cov --all-features --html"

[tasks.audit]
description = "Run security vulnerability audit"
dir = "rs"
run = "cargo audit"

[tasks.publish-check]
description = "Verify package is ready for publishing"
dir = "rs"
run = "cargo publish --dry-run --allow-dirty"

[tasks.ci]
description = "Run all CI checks locally"
# Sequential on purpose: these tasks share one target directory, and running them
# at once lets one rebuild delete a test binary another is about to execute,
# which fails as "No such file or directory" and reads as a broken test rather
# than the race it is.
run = '''
#!/usr/bin/env bash
set -euo pipefail

for task in check docs check:cargo test test:interop features:matrix; do
  echo "=== mise run ${task} ==="
  mise run "${task}"
done
'''

[tasks.ci-full]
description = "Run all CI checks including WASM"
depends = ["ci", "wasm"]
