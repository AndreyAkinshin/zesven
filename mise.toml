min_version = "2024.12.0"

[tools]
node = "22"
pnpm = "latest"
# Without this, `cargo` resolves to a mise shim with no toolchain behind it and
# every task fails with "No version is set for shim: cargo". CI installs its own
# toolchain through dtolnay/rust-toolchain, so this is for local runs.
rust = "stable"

[env]
CARGO_TERM_COLOR = "always"

[tasks.fmt]
description = "Check code formatting"
dir = "rs"
run = "cargo fmt --all --check"

[tasks."fmt:fix"]
description = "Fix code formatting"
dir = "rs"
run = "cargo fmt --all"

[tasks.clippy]
description = "Run clippy lints"
dir = "rs"
run = "cargo clippy --all-features --all-targets -- -D warnings"

[tasks."clippy:fix"]
description = "Run clippy with auto-fix"
dir = "rs"
run = "cargo clippy --all-features --all-targets --fix --allow-dirty --allow-staged"

[tasks.docs]
description = "Build Rust API documentation"
dir = "rs"
run = "cargo doc --all-features --no-deps"

[tasks."docs:open"]
description = "Build and open Rust API documentation in browser"
dir = "rs"
run = "cargo doc --all-features --no-deps --open"

[tasks."docs:site"]
description = "Build VitePress documentation site"
dir = "docs"
run = "pnpm build"

[tasks."docs:dev"]
description = "Run VitePress documentation site in dev mode"
dir = "docs"
depends = ["docs:install"]
run = "pnpm dev"

[tasks."docs:preview"]
description = "Preview built VitePress documentation site"
dir = "docs"
run = "pnpm preview"

[tasks."docs:install"]
description = "Install VitePress documentation dependencies"
dir = "docs"
run = "pnpm install"

[tasks.msrv]
description = "Check the crate builds on its declared minimum Rust version"
dir = "rs"
# The version comes from the manifest rather than being repeated here, so the
# two cannot disagree. Running plain `cargo check` was worse than not checking:
# it compiled with whatever toolchain was current and reported success for a
# crate that may well not build on the version it advertises.
run = '''
#!/usr/bin/env bash
set -euo pipefail

msrv="$(grep -m1 '^rust-version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
if [[ -z "${msrv}" ]]; then
  echo "no rust-version in Cargo.toml" >&2
  exit 1
fi

# Asked by trying to use it rather than by reading the list: on CI two things
# manage toolchains at once - the setup action and mise - and the list one of
# them prints is not necessarily the set the other can run. Parsing it said the
# toolchain was there and `rustup run` then reported it was not.
if ! rustup run "${msrv}" rustc --version > /dev/null 2>&1; then
  echo "installing Rust ${msrv} to check the MSRV"
  rustup toolchain install "${msrv}" --profile minimal
fi

# The library, the binaries and the examples, but not the tests: the MSRV is a
# promise about what a dependent can build, and nobody builds our test suite.
# Holding the tests to it would mean writing them in an older dialect than the
# code they exercise, for no one's benefit.
echo "checking against Rust ${msrv}"
rustup run "${msrv}" cargo check --all-features --lib --bins --examples
'''

[tasks.check]
description = "Run all static analysis"
depends = ["fmt", "clippy"]

[tasks."check:fix"]
description = "Auto-fix all static analysis issues"
depends = ["fmt:fix", "clippy:fix"]

[tasks."hooks:install"]
description = "Point git at the repository's hooks"
# Hooks live in the repository rather than in .git/hooks so they are versioned
# with the code that decides what they enforce; git needs telling once per
# clone.
run = "git config core.hooksPath .githooks"

[tasks."check:cargo"]
description = "Run cargo check with all features"
dir = "rs"
run = "cargo check --all-features"

[tasks.clean]
description = "Remove build artifacts"
dir = "rs"
run = "cargo clean"

[tasks.restore]
description = "Restore dependencies"
dir = "rs"
run = "cargo fetch"

[tasks.build]
description = "Build with all features"
dir = "rs"
run = "cargo build --all-features"

[tasks.test]
description = "Run all tests with all features"
dir = "rs"
run = "cargo test --all-features"

[tasks.features]
description = "Check and test with specific feature flags"
dir = "rs"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo check "$@"
cargo test "$@"
'''

[tasks."features:matrix"]
description = "Test every feature combination in feature-matrix.txt"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Fetched into a variable rather than piped in from a process substitution,
# whose exit status the loop never sees: a generator that failed left the loop
# with nothing to read, and a run that tested no combination at all reported
# success.
combinations="$(mise run --quiet features:list --shell)"
if [[ -z "${combinations}" ]]; then
  echo "no feature combinations to test" >&2
  exit 1
fi

while IFS='|' read -r name features; do
  echo "=== Testing: ${name} (${features}) ==="
  # Through the same task CI uses, so a combination cannot pass here and fail
  # there: `mise run features` enters rs/, where .cargo/config.toml adds
  # -D warnings. Running cargo from the repository root skips that file, and a
  # warning then looks like success.
  mise run features -- ${features}
done <<< "${combinations}"
'''

[tasks."features:list"]
description = "Print the feature matrix as JSON, or as name|flags with --shell"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Comments and blank lines are for the humans editing the file.
entries="$(grep -vE '^\s*(#|$)' feature-matrix.txt)"

if [[ "${1:-}" == "--shell" ]]; then
  echo "${entries}"
  exit 0
fi

# GitHub builds its matrix from this, so it has to be JSON on one line. Written
# by hand rather than with jq, which is not otherwise needed to build or test
# this project.
printf '['
first=1
while IFS='|' read -r name features; do
  [[ ${first} -eq 1 ]] || printf ','
  printf '{"name":"%s","features":"%s"}' "${name}" "${features}"
  first=0
done <<< "${entries}"
printf ']\n'
'''

[tasks."tools:7zip"]
description = "Fetch the pinned reference 7-Zip binary for interop tests"
dir = "rs"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Pinned so the reference behaviour cannot drift under us between runs.
version="26.02"
release="7z2602"
dest="target/tools/7zz"

if [[ -x "$dest" ]]; then
  echo "reference 7-Zip already present: $dest"
  exit 0
fi

case "$(uname -s)-$(uname -m)" in
  Linux-x86_64)   asset="${release}-linux-x64.tar.xz"
                  sha="41aaba7b1235304ab5aa0624530c67ae829496cd29e875925271efdccc28c03e" ;;
  Linux-aarch64)  asset="${release}-linux-arm64.tar.xz"
                  sha="70ea6cc737ae1495ea2d7eb20ef3120fe579bd3f1a83a9d2362b62ec5bde2bba" ;;
  Darwin-*)       asset="${release}-mac.tar.xz"
                  sha="1cf6760579502f87e591ff5c73a005ec50b3e4d6f507e8b038382d563c3175b9" ;;
  *)              echo "no pinned 7-Zip build for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
esac

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

curl -fsSL "https://github.com/ip7z/7zip/releases/download/${version}/${asset}" -o "$tmp/$asset"

if command -v sha256sum >/dev/null 2>&1; then
  echo "${sha}  ${tmp}/${asset}" | sha256sum -c -
else
  echo "${sha}  ${tmp}/${asset}" | shasum -a 256 -c -
fi

tar -xf "$tmp/$asset" -C "$tmp" 7zz
mkdir -p "$(dirname "$dest")"
mv "$tmp/7zz" "$dest"
chmod +x "$dest"
echo "reference 7-Zip installed: $dest"
'''

[tasks."test:interop"]
description = "Run interoperability tests against the reference 7-Zip binary"
dir = "rs"
depends = ["tools:7zip"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
# ZESVEN_REQUIRE_7Z turns a missing reference binary into a failure instead of a
# skip, so this coverage cannot silently disappear.
ZESVEN_REQUIRE_7Z=1 cargo test --all-features --test interop_7zip
'''

[tasks.wasm]
description = "Check WASM compilation"
dir = "rs"
run = "cargo check --target wasm32-unknown-unknown --features wasm"

[tasks.thread-safety]
description = "Run ThreadSanitizer tests (nightly + rust-src required)"
dir = "rs"
env = { RUSTFLAGS = "-Zsanitizer=thread", RUST_MIN_STACK = "8388608" }
# Explicitly through rustup: -Z build-std and the sanitizer are nightly-only, and
# rust-src has to be installed for that same toolchain. Calling plain `cargo`
# would pick up whichever toolchain the repo builds with, which is stable.
run = '''
#!/usr/bin/env bash
set -euo pipefail

rustup run nightly cargo test --features "parallel lzma2" test_parallel \
  -Z build-std --target x86_64-unknown-linux-gnu

# The writer compresses independent entries on several threads. That suite is
# named for what it covers rather than matching the filter above, so it is run
# by name: leaving it to the filter is how the coverage would quietly lapse.
rustup run nightly cargo test --features "parallel lzma2 aes" --test parallel_write \
  -Z build-std --target x86_64-unknown-linux-gnu
'''

[tasks.bench]
description = "Check writer throughput, ratio and parallelism against bounds"
dir = "rs"
# Release, or the numbers measure the debug build's overhead rather than the
# writer. The bounds are machine-independent where it matters: ratios are exact,
# parallel speedup is measured against this same machine, and the throughput
# floor is loose enough that a slow runner will not trip it.
run = "cargo bench --bench write_throughput --features 'lzma2 aes parallel'"

[tasks.coverage]
description = "Generate code coverage report"
dir = "rs"
run = "cargo llvm-cov --all-features"

[tasks.coverage-html]
description = "Generate HTML coverage report"
dir = "rs"
run = "cargo llvm-cov --all-features --html"

[tasks.audit]
description = "Run security vulnerability audit"
dir = "rs"
run = "cargo audit"

[tasks.publish-check]
description = "Verify package is ready for publishing"
dir = "rs"
run = "cargo publish --dry-run --allow-dirty"

[tasks.ci]
description = "Run all CI checks locally"
# Sequential on purpose: these tasks share one target directory, and running them
# at once lets one rebuild delete a test binary another is about to execute,
# which fails as "No such file or directory" and reads as a broken test rather
# than the race it is.
run = '''
#!/usr/bin/env bash
set -euo pipefail

for task in version:check check docs check:cargo test test:interop bench features:matrix; do
  echo "=== mise run ${task} ==="
  mise run "${task}"
done
'''

[tasks.ci-full]
description = "Run all CI checks including WASM"
depends = ["ci", "wasm"]

# ==========================================================================
# Version and Publish
# ==========================================================================

[tasks.version]
description = "Set version, sync manifests, stage, and commit"
usage = 'arg "<version>" help="Version (e.g., 1.2.0 or v1.2.0)"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

# The publish workflow builds whatever is on the default branch, so a release
# started anywhere else publishes something other than what was bumped. Being a
# descendant of origin/main is not enough: a feature branch is one.
git fetch --quiet origin
branch="$(git rev-parse --abbrev-ref HEAD)"
if [[ "${branch}" != "main" ]]; then
  echo "Error: releases are cut from main, not ${branch}" >&2
  exit 1
fi
if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
  echo "Error: main and origin/main differ; push or pull before releasing" >&2
  exit 1
fi

# Everything staged by the bump has to belong to the bump, and the surest way to
# guarantee that is to start from nothing else being there. Untracked files
# count: `git diff` does not see them, and version:sync writes through a file of
# its own that an untracked one of the same name would lose.
# --untracked-files=all rather than the default, which honours
# status.showUntrackedFiles: with that set to "no" the guard saw a clean tree
# with anything untracked in it.
if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
  echo "Error: the working tree is not clean; commit, stash or remove:" >&2
  git status --short --untracked-files=all >&2
  exit 1
fi

VERSION="${usage_version#v}"
# Three components, because Cargo refuses anything else: `version = "2.0"` makes
# every cargo command fail to parse the manifest.
if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
  echo "Error: version must be MAJOR.MINOR.PATCH (got: $VERSION)" >&2
  exit 1
fi
echo "$VERSION" > VERSION
mise run version:sync

# The changelog's Unreleased section becomes this version, dated. Left alone,
# every release shipped notes headed "Unreleased" and the next one appended to
# them.
if grep -q '^## Unreleased' CHANGELOG.md; then
  today="$(date -u +%Y-%m-%d)"
  changelog_tmp="$(mktemp CHANGELOG.XXXXXX)"
  cp -p CHANGELOG.md "${changelog_tmp}"
  sed "s/^## Unreleased$/## ${VERSION} - ${today}/" CHANGELOG.md > "${changelog_tmp}"
  mv "${changelog_tmp}" CHANGELOG.md
else
  echo "Warning: CHANGELOG.md has no Unreleased section to date" >&2
fi
# Only the files the bump touches - which has to include the snippets
# version:sync just rewrote, or the release ships documentation pointing at the
# previous version.
snippet_list="$(mise run --quiet version:snippets)"
snippets=()
while IFS= read -r snippet; do
  [[ -n "${snippet}" ]] && snippets+=("${snippet}")
done <<< "${snippet_list}"
git add VERSION rs/Cargo.toml CHANGELOG.md "${snippets[@]}"
git diff --cached --quiet && echo "Already at $VERSION" || git commit -m "chore: bump version to $VERSION"
'''

[tasks."version:snippets"]
description = "List the tracked files carrying an install snippet"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Tracked files only: a scanner walking the tree also finds whatever untracked
# work happens to be lying about, and the release task feeds this list straight
# to `git add`. It once staged a private notes file whole.
git ls-files -z -- '*.md' '*.rs' \
  | xargs -0 grep -lE 'zesven = (\{ version = )?"[0-9]+\.[0-9]+"' \
  | sort -u
'''

[tasks."version:sync"]
description = "Copy the version from VERSION into the crate manifest"
run = '''
#!/usr/bin/env bash
set -euo pipefail

version="$(tr -d '[:space:]' < VERSION)"

# Written beside the manifest, under a name nothing else can be using: a fixed
# `rs/Cargo.toml.new` silently overwrote whatever happened to be sitting there.
# Seeded with `cp -p` so it carries the manifest's own permissions, since the
# 0600 mktemp creates would otherwise travel with it.
manifest_tmp="$(mktemp rs/Cargo.toml.XXXXXX)"
trap 'rm -f "${manifest_tmp}"' EXIT
cp -p rs/Cargo.toml "${manifest_tmp}"


# Only the version inside [package]: a dependency can carry one too, and the
# range form of sed that would stop at the first match is a GNU extension that
# fails on macOS.
awk -v version="${version}" '
  /^\[/            { in_package = ($0 == "[package]") }
  in_package && /^version = / && !done {
    print "version = \"" version "\""
    done = 1
    next
  }
  { print }
  END {
    if (!done) {
      print "no version line in [package]" > "/dev/stderr"
      exit 1
    }
  }
' rs/Cargo.toml > "${manifest_tmp}"

if [[ ! -s "${manifest_tmp}" ]]; then
  echo "rewriting rs/Cargo.toml produced nothing" >&2
  exit 1
fi

# Moved, not copied over: a redirection truncates the manifest before writing
# it, so a failure partway leaves a manifest that is neither the old one nor
# the new one. The temporary file already carries the right permissions.
mv "${manifest_tmp}" rs/Cargo.toml
trap - EXIT

# The install snippets carry a version too. Left out of this, they kept telling
# readers to depend on the previous major long after it stopped being current.
#
# Found rather than listed: the first version of this carried a hand-written
# list of files, and promptly missed two of them.
major_minor="${version%.*}"
# Read line by line rather than word-split: a tracked path with a space in it
# would otherwise arrive as two filenames, neither of which exists.
#
# And edited through a temporary file rather than with `sed -i`, whose spelling
# differs between GNU and BSD: `-i -E` on macOS takes -E as the backup suffix,
# so the expression never runs and a stray backup file appears instead.
#
# Fetched into a variable first: a process substitution's exit status never
# reaches the loop, so a generator that failed would leave the snippets
# silently unrewritten.
snippet_list="$(mise run --quiet version:snippets)"
while IFS= read -r doc; do
  [[ -n "${doc}" ]] || continue
  doc_tmp="$(mktemp "${doc}.XXXXXX")"
  cp -p "${doc}" "${doc_tmp}"
  sed -E \
    -e "s/(zesven = \")[0-9]+\.[0-9]+(\")/\1${major_minor}\2/g" \
    -e "s/(zesven = \{ version = \")[0-9]+\.[0-9]+(\")/\1${major_minor}\2/g" \
    "${doc}" > "${doc_tmp}"
  mv "${doc_tmp}" "${doc}"
done <<< "${snippet_list}"
'''

[tasks."version:check"]
description = "Verify VERSION and the crate manifest agree"
run = '''
#!/usr/bin/env bash
set -euo pipefail

declared="$(tr -d '[:space:]' < VERSION)"
manifest="$(grep -m1 '^version = ' rs/Cargo.toml | sed 's/version = "\(.*\)"/\1/')"

if [[ "${declared}" != "${manifest}" ]]; then
  echo "VERSION says ${declared}, rs/Cargo.toml says ${manifest}" >&2
  echo "run: mise run version:sync" >&2
  exit 1
fi
'''

[tasks.publish]
description = "Bump version, push, and trigger release"
usage = 'arg "<version>" help="Version (e.g., 1.2.0 or v1.2.0)"'
run = [
    "mise run version $usage_version",
    # Explicit, both of them: `git push` without a target follows whatever
    # upstream happens to be configured, and a workflow dispatched without a ref
    # runs on the default branch - which is how a release could be cut from one
    # branch and published from another.
    "git push origin main",
    "gh workflow run publish.yml --ref main",
]
